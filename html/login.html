<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - Marketplace for Used Items</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f7f7f7;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            background: #ffffff;
            padding: 40px 60px;
            border-radius: 16px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            position: relative;
        }
        .back-btn {
            position: absolute;
            top: 15px;
            left: 15px;
            background: #ccc;
            color: #333;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
        }
        .back-btn:hover {
            background: #bbb;
        }
        h1 {
            margin-bottom: 30px;
            font-size: 2rem;
            color: #333;
        }
        input {
            display: block;
            width: 250px;
            margin: 15px auto;
            padding: 12px;
            font-size: 1rem;
            border: 1px solid #ccc;
            border-radius: 8px;
        }
        button.login {
            display: block;
            width: 250px;
            margin: 25px auto 0;
            padding: 12px;
            font-size: 1rem;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button.login:hover {
            background: #45a049;
        }
        #userStatus {
            margin-top: 20px;
            font-size: 1rem;
            color: #555;
        }
        #goMainMenuBtn {
            display: none;
            margin-top: 20px;
            width: 250px;
            padding: 12px;
            font-size: 1rem;
            background: #2196F3;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        #goMainMenuBtn:hover {
            background: #1976D2;
        }
    </style>
</head>
<body>
    <div class="container">
        <button class="back-btn" onclick="window.location.href='login_create_forgotpass.html'">&larr; Back</button>
        <h1>Login</h1>

        <input type="text" id="username" placeholder="Username">
        <input type="password" id="password" placeholder="Password">

        <button class="login" id="loginBtn">Login</button>

        <!-- Display the user ID -->
        <p id="userStatus"></p>

        <!-- Button that appears if user is logged in -->
        <button id="goMainMenuBtn" onclick="window.location.href='main_menu.html'">Go to Main Menu</button>
    </div>

    <script>
        const login_script = "./use_cases/login_and_create_account/login.sh";
        const HELPER_SCRIPT = "./helper_scripts/run_user_script.sh";

        async function runScript(params) {
            const response = await fetch('/run-script', {
                method: 'POST',
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ params })
            });
            return response.text();
        }

        document.getElementById('loginBtn').addEventListener('click', async () => {
            const user = document.getElementById('username').value || "";
            const pass = document.getElementById('password').value || "";
            const params = [HELPER_SCRIPT, login_script, user, pass];
            const text = await runScript(params);
            alert(text);

            // After script finishes, check login status and redirect if logged in
            try {
                const res = await fetch('../json/local/local_data.json');

                const data = await res.json();
                if (data.currentlyLoggedInUserID !== -1) {
                    window.location.href = "main_menu.html";
                } else {
                    location.reload();
                }
            } catch (err) {
                // fallback: reload if error
                location.reload();
            }
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - Marketplace for Used Items</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f7f7f7;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            background: #ffffff;
            padding: 40px 60px;
            border-radius: 16px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            position: relative;
        }
        .back-btn {
            position: absolute;
            top: 15px;
            left: 15px;
            background: #ccc;
            color: #333;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
        }
        .back-btn:hover {
            background: #bbb;
        }
        h1 {
            margin-bottom: 30px;
            font-size: 2rem;
            color: #333;
        }
        input {
            display: block;
            width: 250px;
            margin: 15px auto;
            padding: 12px;
            font-size: 1rem;
            border: 1px solid #ccc;
            border-radius: 8px;
        }
        button.login {
            display: block;
            width: 250px;
            margin: 25px auto 0;
            padding: 12px;
            font-size: 1rem;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button.login:hover {
            background: #45a049;
        }
        #userStatus {
            margin-top: 20px;
            font-size: 1rem;
            color: #555;
        }
    </style>
</head>
<body>
    <div class="container">
        <button class="back-btn" onclick="window.location.href='login_create_forgotpass.html'">&larr; Back</button>
        <h1>Login</h1>

        <input type="text" id="username" placeholder="Username">
        <input type="password" id="password" placeholder="Password">

        <button class="login" id="loginBtn">Login</button>

        <!-- Display the user ID -->
        <p id="userStatus"></p>
    </div>

    <script>
        const LOGIN_SCRIPT = "./use_cases/login_and_create_account/login.sh";

        async function runScript(params) {
            const response = await fetch('/run-script', {
                method: 'POST',
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ params })
            });
            return response.text();
        }

        async function checkLoginStatus() {
            try {
                const res = await fetch('./json/local/local_data.json');
                const data = await res.json();

                // Show the value on the page
                document.getElementById('userStatus').textContent =
                    `currentlyLoggedInUserID: ${data.currentlyLoggedInUserID}`;

                // Redirect if logged in
                if (data.currentlyLoggedInUserID !== -1) {
                    window.location.href = 'main_menu.html';
                }
            } catch (err) {
                console.error('Error checking login status:', err);
            }
        }

        document.getElementById('loginBtn').addEventListener('click', async () => {
            const user = document.getElementById('username').value || "";
            const pass = document.getElementById('password').value || "";
            const params = [LOGIN_SCRIPT, user, pass];
            const text = await runScript(params);
            alert(text);

            // Refresh the page after the script finishes
            location.reload();
        });

        // Run on page load
        checkLoginStatus();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Marketplace for Used Items</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f7f7f7;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            text-align: center;
            background: #ffffff;
            /*padding: 40px 60px;*/
            padding: 15px 60px 40px 60px;
            border-radius: 16px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        h1 {
            margin-bottom: 10px;
            font-size: 2rem;
            color: #333;
        }

        h2 {
            margin-bottom: 30px;
            font-size: 1.2rem;
            color: #666;
        }

        #goMainMenuBtn {
            display: flex;
            margin-top: 20px;
            margin-left: 0px;
            width: 80px;
            height: 35px;
            padding: 12px;
            font-size: .9rem;
            background: #cccccc;
            color: black;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            text-align: center;
        }

        #goMainMenuBtn:hover {
            background: #acacac;
        }

        button {
            display: block;
            width: 250px;
            margin: 15px auto;
            padding: 12px;
            font-size: 1rem;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background: #45a049;
        }

        input[type="text"] {
            text-align: center;
            width: 150px;
            height: 25px;

        }

        input::placeholder {
            text-align: center;
        }

        select {

            width: 250px;
            height: 30px;
        }

        .security_questions {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-top: 30px;
            margin-left: 100px;
        }

        #sq_answer {
            width: 250px;
        }

        #Password_Labels {
            display: flex;
            margin-left: 170px;
            gap: 90px;
            font-size: 12px;
        }

        #requirements {
            text-align: left;
            font-size: 14px;
            justify-content: center;

        }
    </style>
</head>

<body>

    <div class="container">
        <button id="goMainMenuBtn" onclick="window.location.href='../../login_create_forgotpass.html'">&larr;
            Back</button>
        <h1>Welcome to the Marketplace for Used Items!</h1>

        <h2 id="changing-banner">Please enter the username associated with your account.</h2>

        <!-- textbot for username -->
        <input type="text" id="username" style="pointer-events: any" name="username" placeholder="Enter your username">
        <button id='VerifyOwnerBtn' style="display: block" onclick="newVerify()">Verify Ownership</button>

        <div class="security_questions">
            <select name="SQ_dropdown" id="SQ_dropdown" style="display:none"
                placeholder="Please select a security question.">
                <option value="0" disabled selected>Please select a security question.</option>
                <option value="1">What is the name of your first pet?</option>
                <option value="2">What university did you study at?</option>
                <option value="3">What was the name of your elementary school?</option>
            </select>
            <input type="text" id="sq_answer" name="sq_answer" style="display: none"
                placeholder="Please enter your answer here.">
        </div>


        <!-- Login button now redirects -->

        <!--<button onclick="window.location.href='answer_security_questions.html'">Verify Ownership</button> -->



        <button id='VerifySecurityAnswer' style="display: none" onclick="verifySecurityAnswer()">Verify Security
            Answer</button>
        <div id="Password_Labels" style="display:none">
            <label id="newPasswordLabel">New Password</label>
            <label id="verifyPasswordLabel">Verify Password</label>
        </div>
        <div id="New_Password_Section">

            <form name="PasswordForm" id="PasswordForm" style="display: none">
                <input id="newPassword" name="newPassword" type="Password">
                <input id="verifyNewPassword" name="verifyNewPassword" type="Password">
            </form>
        </div>

        <div id="requirements" style="display: none">
            <h4>Password requirements:</h4>
            <ul>
                <li>Minimum 8 characters</li>
                <li>Minimum 1 uppercase letter</li>
                <li>Minimum 1 number</li>
            </ul>
        </div>

        <button id='SubmitNewPassword' style="display:none" onclick="createNewPassword()">Update Password</button>

        <!--<button onclick="script"  Keep other buttons running scripts <button id="createBtn">Create Account</button>
        <button id="forgotBtn">Forgot Password</button> -->


    </div>
    <script>
        async function newVerify() {
            // const account_handler = "account_handler.py";

            const enteredUsername = document.getElementById('username').value;

            if (!enteredUsername) {
                alert("Please enter a username.");
                return;
            } else {
                try {
                    // send data to node.js server
                    const response = await fetch('/verify-username', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ 'username': enteredUsername })
                    });
                    // wait for response from server
                    const data = await response.json();
                    console.log(data.response);
                    if (data.response == "Username was found") {
                        const hiddenButton = document.getElementById('VerifySecurityAnswer');
                        const voButton = document.getElementById('VerifyOwnerBtn');
                        const sqDropdown = document.getElementById('SQ_dropdown')
                        const sqAnswer = document.getElementById('sq_answer');
                        const user_input_box = document.getElementById('username');
                        const banner = document.getElementById('changing-banner');


                        banner.textContent = "Please select and answer a security question"
                        hiddenButton.style.display = 'block';
                        sqDropdown.style.display = 'block';
                        sqAnswer.style.display = 'block';

                        voButton.style.display = 'none';
                        user_input_box.style.setProperty('pointer-events', 'none');


                        // populate the dropdown


                    } else {
                        alert("Username was not found. Please try again.")
                    }
                    // use the results!
                    // if (data.success) {
                    //     alert(data.display);
                    // } else {
                    //     alert('Error: ');
                    // }
                } catch (err) {
                    alert('Error detected: ' + err);
                }
            }


        }

        async function verifySecurityAnswer() {

            const username = document.getElementById("username").value;
            const SQ_dropdown_object = document.getElementById('SQ_dropdown');
            const securityQuestionIndex = SQ_dropdown_object.selectedIndex;
            //alert(securityQuestionIndex)
            const securityQuestion = SQ_dropdown_object.options[securityQuestionIndex];

            const securityQuestionText = securityQuestion.text;
            //alert(securityQuestionText);
            const securityAnswer = document.getElementById('sq_answer').value;



            if (securityQuestionIndex < 1) {
                alert("Please select a security question");
            } else {


                try {
                    const response = await fetch('/verify-security-answer', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            'username': username,
                            'selected_sq': securityQuestionText,
                            'sq_answer': securityAnswer
                        })

                    });


                    const data = await response.json();
                    //alert("Check data result")
                    //alert(data.result)

                    if (data.result == "Success") { // works up to this point!
                        const passwordForm = document.getElementById('PasswordForm');
                        const requirementList = document.getElementById('requirements');
                        const submitPassBtn = document.getElementById('SubmitNewPassword');
                        const hiddenButton = document.getElementById('VerifySecurityAnswer');
                        const sqDropdown = document.getElementById('SQ_dropdown')
                        const sqAnswer = document.getElementById('sq_answer');
                        const passwordLabels = document.getElementById('Password_Labels');

                        passwordForm.style.display = 'block';
                        requirementList.style.display = 'flex';
                        submitPassBtn.style.display = 'block';
                        passwordLabels.style.display = 'flex';

                        hiddenButton.style.display = 'none';
                        sqDropdown.style.display = 'none';
                        sqAnswer.style.display = 'none';


                    }
                    else {
                        alert("Answer provided does not match.")
                    }


                } catch (err) {
                    alert("Error Caught:")
                    alert(err);
                }

            }




        }

        async function createNewPassword() {
            const username = document.getElementById("username").value;
            const password_1_obj = document.getElementById("newPassword").value;
            const password_verify_obj = document.getElementById("verifyNewPassword").value;

            if (password_1_obj == password_verify_obj) {
                // verify that it meets requirements:
                try {
                    const response = await fetch('/verify-password', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            'username': username,
                            'password': password_1_obj
                        })

                    });
                    const data = await response.json();
                    switch (data.response) {
                        case "Er1": alert("Please verify password field is filled out."); return;
                        case "Er2": alert("Password length is a minimum of eight characters."); return;
                        case "Er3": alert("Password must contain a minimum one uppercase letter"); return;
                        case "Er4": alert("Password must contain a minimum of one number"); return;
                        default: break;
                    }

                    // now we edit the password!

                    if (data.result == "Password reset success!") {
                        alert("Password reset completed! \n Redirecting you to the login page");
                        window.location.href = "../login.html"
                    }


                } catch (err) {
                    console.log("Error detected");
                    console.log(err);
                }

            } else {
                alert("Passwords do not match");

            }


        }

    </script>
</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Marketplace for Used Items</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f7f7f7;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            text-align: center;
            background: #ffffff;
            padding: 40px 60px;
            border-radius: 16px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        h1 {
            margin-bottom: 10px;
            font-size: 2rem;
            color: #333;
        }

        h2 {
            margin-bottom: 30px;
            font-size: 1.2rem;
            color: #666;
        }

        button {
            display: block;
            width: 250px;
            margin: 15px auto;
            padding: 12px;
            font-size: 1rem;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background: #45a049;
        }

        input[type="text"] {
            text-align: center;
            width: 150px;
            height: 25px;

        }

        input::placeholder {
            text-align: center;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Welcome to the Marketplace for Used Items!</h1>
        <h2>Please enter the username associated with your account.</h2>

        <!-- textbot for username -->
        <input type="text" id="username" name="username" placeholder="Enter your username">

        <!-- Login button now redirects -->

        <button onclick="window.location.href='answer_security_questions.html'">Verify Ownership</button>

        <!-- Keep other buttons running scripts
        <button id="createBtn">Create Account</button>
        <button id="forgotBtn">Forgot Password</button> -->
    </div>
</body>

</html>

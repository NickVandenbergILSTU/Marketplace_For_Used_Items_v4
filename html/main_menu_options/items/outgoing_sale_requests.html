<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Outgoing Sale Requests</title>
    <link rel="stylesheet" href="/html/css/items.css">
</head>

<body>
    <div class="header-panel">
        <button class="back-btn" onclick="window.location.href='/html/main_menu.html'">← Main Menu</button>
        <div class="header-title">Outgoing Sale Requests</div>
        <div class="user-info">
            <div class="username" id="username">Loading...</div>
            <div class="balance" id="balance">$0.00</div>
        </div>
    </div>

    <div class="main-content">
        <div class="sort-controls">
            <label for="search">Search:</label>
            <input type="text" id="search" class="search-input" placeholder="Search items..." oninput="filterItems()">

            <label for="sort">Sort by:</label>
            <select id="sort" onchange="loadItems(this.value)">
                <option value="default">Default Order</option>
                <option value="alphabetical">Alphabetical</option>
                <option value="rating">Rating</option>
                <option value="price">Price</option>
            </select>
        </div>

        <div id="itemsContainer"></div>
    </div>

    <script>
        const HELPER_SCRIPT = './helper_scripts/run_user_script.sh';
        let userBookmarkedItems = [];
        let currentUserId = null;
        let allItems = [];
        let allAccounts = [];
        let outgoingSaleRequestsMap = {};

        async function sendHttpRequest(params) {
            try {
                const response = await fetch("/run-script", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ params })
                });
                const text = await response.text();
                return { success: true, text };
            } catch (error) {
                console.error('Error sending HTTP request:', error);
                return { success: false, error };
            }
        }

        async function loadUserData() {
            try {
                const localDataResponse = await fetch('/json/local/local_data.json');
                if (!localDataResponse.ok) {
                    throw new Error(`HTTP error! status: ${localDataResponse.status}`);
                }
                const localData = await localDataResponse.json();
                currentUserId = localData.currentlyLoggedInUserID;

                const accountsResponse = await fetch('/json/accounts.json');
                if (!accountsResponse.ok) {
                    throw new Error(`HTTP error! status: ${accountsResponse.status}`);
                }
                const accounts = await accountsResponse.json();

                const currentUser = accounts.find(account => account.id === currentUserId);

                const usernameElement = document.getElementById('username');
                const balanceElement = document.getElementById('balance');

                if (currentUser && currentUser.username) {
                    usernameElement.textContent = currentUser.username;
                    const balance = currentUser.accountBalance || currentUser.accountBlanance || 0;
                    const balanceNum = typeof balance === 'number' ? balance : parseFloat(balance);
                    balanceElement.textContent = `$${balanceNum.toFixed(2)}`;
                } else {
                    usernameElement.textContent = 'Guest User';
                    balanceElement.textContent = '$0.00';
                }
            } catch (error) {
                console.error('Error loading user data:', error);
                document.getElementById('username').textContent = 'Guest User';
                document.getElementById('balance').textContent = '$0.00';
            }
        }

        async function loadItems(order = "default") {
            try {
                // Get local data
                const localDataResponse = await fetch('/json/local/local_data.json');
                const localData = await localDataResponse.json();
                currentUserId = localData.currentlyLoggedInUserID;

                // Get accounts
                const accountsResponse = await fetch('/json/accounts.json');
                allAccounts = await accountsResponse.json();
                const currentUser = allAccounts.find(account => account.id === currentUserId);

                if (!currentUser) {
                    console.error('Current user not found');
                    return;
                }

                // Get outgoing sale requests
                const outgoingSaleRequests = currentUser.outgoingSaleRequests || [];
                userBookmarkedItems = currentUser.bookmarkedItems || [];

                // Create a map of itemId -> userId for quick lookup
                outgoingSaleRequestsMap = {};
                outgoingSaleRequests.forEach(request => {
                    outgoingSaleRequestsMap[request.itemId] = request.userId;
                });

                // Get item IDs from outgoing sale requests
                const outgoingItemIds = outgoingSaleRequests.map(request => request.itemId);

                // Get all items
                const itemsResponse = await fetch('/json/items.json');
                const allItemsData = await itemsResponse.json();

                // Filter items to only those in outgoing sale requests
                let items = allItemsData.filter(item => outgoingItemIds.includes(item.id));

                // Calculate average ratings
                items.forEach(item => {
                    if (Array.isArray(item.ratings) && item.ratings.length > 0) {
                        const sum = item.ratings.reduce((acc, r) => acc + r.rating, 0);
                        item.avgRating = sum / item.ratings.length;
                    } else {
                        item.avgRating = 0;
                    }
                });

                // Sort items
                if (order === "alphabetical") {
                    items.sort((a, b) => a.name.localeCompare(b.name));
                } else if (order === "rating") {
                    items.sort((a, b) => b.avgRating - a.avgRating);
                } else if (order === "price") {
                    items.sort((a, b) => {
                        const parsePrice = str => parseFloat(str.replace(/[^0-9.]/g, ""));
                        return parsePrice(b.price) - parsePrice(a.price);
                    });
                }

                allItems = items;
                filterItems();
            } catch (error) {
                console.error('Error loading items:', error);
            }
        }

        function filterItems() {
            const searchTerm = document.getElementById('search').value.toLowerCase();
            const filteredItems = allItems.filter(item =>
                item.name.toLowerCase().includes(searchTerm)
            );
            renderItems(filteredItems);
        }

        async function renameItem(itemId, newName) {
            if (!newName || newName.trim() === '') {
                alert('Please enter a new name');
                return;
            }

            const params = [
                HELPER_SCRIPT,
                './use_cases/rename_item/rename_item.sh',
                itemId.toString(),
                newName.trim()
            ];

            const result = await sendHttpRequest(params);
            if (result.success) {
                alert(result.text);
            } else {
                alert('Error renaming item');
            }
            window.location.reload();
        }

        async function deleteItem(itemId) {
            if (!confirm('Are you sure you want to delete this item?')) {
                return;
            }

            const params = [
                HELPER_SCRIPT,
                './use_cases/delete_item/delete_item.sh',
                itemId.toString()
            ];

            const result = await sendHttpRequest(params);
            if (result.success) {
                alert(result.text);
            } else {
                alert('Error deleting item');
            }
            window.location.reload();
        }

        async function cancelSaleRequest(itemId, buyerName) {
            if (!confirm(`Cancel sale request to ${buyerName}?`)) {
                return;
            }

            const buyerUserId = outgoingSaleRequestsMap[itemId];
            const params = [
                HELPER_SCRIPT,
                './use_cases/sell_item_to_another_user/handle_outgoing_sale_request.sh',
                itemId.toString(),
                buyerUserId.toString()
            ];

            const result = await sendHttpRequest(params);
            if (result.success) {
                alert(result.text);
            } else {
                alert('Error canceling sale request');
            }
            window.location.reload();
        }

        async function rateItem(itemId, rating) {
            if (!rating) {
                alert('Please select a rating');
                return;
            }

            const params = [
                HELPER_SCRIPT,
                './use_cases/rate_item/rate_item_main.py',
                itemId.toString(),
                rating.toString()
            ];

            const result = await sendHttpRequest(params);
            if (result.success) {
                alert(result.text);
            } else {
                alert('Error rating item');
            }
            window.location.reload();
        }

        async function setItemPrice(itemId, newPrice) {
            if (!newPrice || newPrice.trim() === '') {
                alert('Please enter a new price');
                return;
            }

            const params = [
                HELPER_SCRIPT,
                './use_cases/set_item_price/set_item_price.sh',
                itemId.toString(),
                newPrice.trim()
            ];

            const result = await sendHttpRequest(params);
            if (result.success) {
                alert(result.text);
            } else {
                alert('Error setting price');
            }
            window.location.reload();
        }

        async function bookmarkItem(itemId) {
            const params = [
                HELPER_SCRIPT,
                './use_cases/bookmark_and_unbookmark_item/main.py',
                itemId.toString()
            ];

            const result = await sendHttpRequest(params);
            if (result.success) {
                alert(result.text);
            } else {
                alert('Error bookmarking item');
            }
            window.location.reload();
        }

        async function replaceImage(itemId) {
            const message = "Please drop the desired image (PNG) in the folder _ITEM_IMAGE_DROPBOX, then click OK.";

            if (confirm(message)) {
                const params = [
                    HELPER_SCRIPT,
                    './use_cases/add_item_image/add_item_image.sh',
                    itemId.toString()
                ];

                const result = await sendHttpRequest(params);
                if (result.success) {
                    alert(result.text);
                } else {
                    alert('Error replacing image');
                }
                window.location.reload();
            }
        }

        async function deleteImage(itemId) {
            if (confirm("Click OK to confirm you want this image deleted")) {
                const params = [
                    HELPER_SCRIPT,
                    './use_cases/remove_item_image/remove_item_image.sh',
                    itemId.toString()
                ];

                const result = await sendHttpRequest(params);
                if (result.success) {
                    alert(result.text);
                } else {
                    alert('Error deleting image');
                }
                window.location.reload();
            }
        }

        async function addImage(itemId) {
            const message = "Please drop the desired image (PNG) in the folder _ITEM_IMAGE_DROPBOX, then click OK.";

            if (confirm(message)) {
                const params = [
                    HELPER_SCRIPT,
                    './use_cases/add_item_image/add_item_image.sh',
                    itemId.toString()
                ];

                const result = await sendHttpRequest(params);
                if (result.success) {
                    alert(result.text);
                } else {
                    alert('Error adding image');
                }
                window.location.reload();
            }
        }

        async function sellToStore(itemId, storeId) {
            if (!storeId) {
                alert('Please select a store');
                return;
            }

            const params = [
                HELPER_SCRIPT,
                './use_cases/sell_to_store/sell_to_store.sh',
                itemId.toString(),
                storeId.toString()
            ];

            const result = await sendHttpRequest(params);
            if (result.success) {
                alert(result.text);
            } else {
                alert('Error selling to store');
            }
            window.location.reload();
        }

        async function openComments(itemId) {
            const params = [
                HELPER_SCRIPT,
                './use_cases/select_item_comment/select_item_comment.sh',
                itemId.toString()
            ];

            const result = await sendHttpRequest(params);
            if (result.success) {
                window.location.href = '/html/main_menu_options/items/item_comments/item_comments.html';
            } else {
                console.error('Error opening comments');
            }
        }

        function renderItems(items) {
            const container = document.getElementById("itemsContainer");
            container.innerHTML = "";

            if (items.length === 0) {
                container.innerHTML = '<div class="no-items">No outgoing sale requests found.</div>';
                return;
            }

            items.forEach(item => {
                const itemBox = document.createElement("div");
                itemBox.className = "item-box";

                const isBookmarked = userBookmarkedItems.includes(item.id);

                const nameContainer = document.createElement("div");
                nameContainer.className = "item-name-container";

                const name = document.createElement("h3");
                name.textContent = item.name;
                nameContainer.appendChild(name);

                if (isBookmarked) {
                    const bookmarkEmoji = document.createElement("span");
                    bookmarkEmoji.className = "bookmark-emoji";
                    bookmarkEmoji.textContent = "🔖";
                    nameContainer.appendChild(bookmarkEmoji);
                }

                const price = document.createElement("p");
                price.innerHTML = `<strong>Price:</strong> <span class="price-text">${item.price}</span>`;

                const rating = document.createElement("p");
                const stars = "⭐".repeat(Math.floor(item.avgRating));
                rating.innerHTML = `<strong>Rating:</strong> <span class="rating-text">${item.avgRating.toFixed(1)} ${stars}</span>`;

                // Get buyer information
                const buyerUserId = outgoingSaleRequestsMap[item.id];
                const buyer = allAccounts.find(acc => acc.id === buyerUserId);
                const buyerName = buyer ? buyer.username : 'Unknown User';

                const proposedTo = document.createElement("p");
                proposedTo.innerHTML = `<strong>Proposed Sale To:</strong> <span style="color: #007bff; font-weight: bold;">${buyerName}</span>`;

                const img = document.createElement("img");
                img.className = "item-img";
                img.alt = item.name;
                img.src = `/images/items/${item.id}.png`;

                const imgButtons = document.createElement("div");
                imgButtons.className = "img-buttons";

                img.onload = () => {
                    imgButtons.innerHTML = `
                        <button onclick="replaceImage(${item.id})">Replace Image</button>
                        <button onclick="deleteImage(${item.id})">Delete Image</button>
                    `;
                };
                img.onerror = () => {
                    img.style.display = "none";
                    imgButtons.innerHTML = `<button onclick="addImage(${item.id})">Add Image</button>`;
                };

                const actions = document.createElement("div");
                actions.className = "action-group";

                const renameDiv = document.createElement("div");
                renameDiv.className = "action-row";
                const renameInput = document.createElement("input");
                renameInput.type = "text";
                renameInput.placeholder = "New Name";
                renameInput.style.fontSize = "14px";
                const renameBtn = document.createElement("button");
                renameBtn.textContent = "Rename";
                renameBtn.onclick = () => renameItem(item.id, renameInput.value);
                renameDiv.appendChild(renameInput);
                renameDiv.appendChild(renameBtn);

                const rateDiv = document.createElement("div");
                rateDiv.className = "action-row";
                const rateSelect = document.createElement("select");
                for (let i = 1; i <= 5; i++) {
                    const opt = document.createElement("option");
                    opt.value = i;
                    opt.textContent = `${i} Star${i > 1 ? 's' : ''}`;
                    rateSelect.appendChild(opt);
                }
                const rateBtn = document.createElement("button");
                rateBtn.textContent = "Rate";
                rateBtn.onclick = () => rateItem(item.id, rateSelect.value);
                rateDiv.appendChild(rateSelect);
                rateDiv.appendChild(rateBtn);

                const priceDiv = document.createElement("div");
                priceDiv.className = "action-row";
                const priceInput = document.createElement("input");
                priceInput.type = "text";
                priceInput.placeholder = "New Price";
                const priceBtn = document.createElement("button");
                priceBtn.textContent = "Set Price";
                priceBtn.onclick = () => setItemPrice(item.id, priceInput.value);
                priceDiv.appendChild(priceInput);
                priceDiv.appendChild(priceBtn);

                const bookmarkBtn = document.createElement("button");
                bookmarkBtn.textContent = isBookmarked ? "Unbookmark" : "Bookmark";
                bookmarkBtn.onclick = () => bookmarkItem(item.id);

                const cancelSaleBtn = document.createElement("button");
                cancelSaleBtn.textContent = "🚫 Cancel Sale Request";
                cancelSaleBtn.style.backgroundColor = "#dc3545";
                cancelSaleBtn.onclick = () => cancelSaleRequest(item.id, buyerName);

                const deleteBtn = document.createElement("button");
                deleteBtn.textContent = "🗑️ Delete Item";
                deleteBtn.style.backgroundColor = "#6c757d";
                deleteBtn.onclick = () => deleteItem(item.id);

                const sellStoreDiv = document.createElement("div");
                sellStoreDiv.className = "action-row";
                const sellStoreSelect = document.createElement("select");
                sellStoreSelect.innerHTML = `<option value="">Select Store...</option>`;
                fetch("/api/locations")
                    .then(res => res.json())
                    .then(locations => {
                        locations.forEach(loc => {
                            const opt = document.createElement("option");
                            opt.value = loc.id;
                            opt.textContent = loc.name;
                            sellStoreSelect.appendChild(opt);
                        });
                    });
                const sellStoreBtn = document.createElement("button");
                sellStoreBtn.textContent = "Sell to Store";
                sellStoreBtn.onclick = () => sellToStore(item.id, sellStoreSelect.value);
                sellStoreDiv.appendChild(sellStoreSelect);
                sellStoreDiv.appendChild(sellStoreBtn);

                const commentsBtn = document.createElement("button");
                commentsBtn.textContent = "💬 Comments";
                commentsBtn.onclick = () => openComments(item.id);

                actions.appendChild(renameDiv);
                actions.appendChild(rateDiv);
                actions.appendChild(priceDiv);
                actions.appendChild(bookmarkBtn);
                actions.appendChild(cancelSaleBtn);
                actions.appendChild(deleteBtn);
                actions.appendChild(sellStoreDiv);
                actions.appendChild(commentsBtn);

                itemBox.appendChild(nameContainer);
                itemBox.appendChild(price);
                itemBox.appendChild(rating);
                itemBox.appendChild(proposedTo);
                itemBox.appendChild(img);
                itemBox.appendChild(imgButtons);
                itemBox.appendChild(actions);

                container.appendChild(itemBox);
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadUserData();
            loadItems();
        });
    </script>
</body>

</html>

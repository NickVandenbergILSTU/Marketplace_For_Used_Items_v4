<!DOCTYPE html>  
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Items</title>
    <link rel="stylesheet" href="/html/main_menu_options/items/items.css">
</head>
<body>
    <div class="header-panel">
        <button class="back-btn" onclick="window.location.href='/html/main_menu.html'">← Main Menu</button>
        <div class="header-title">My Items</div>
        <div class="username" id="username">Loading...</div>
    </div>

    <div class="main-content">
        <div class="sort-controls">
            <label for="sort">Sort by:</label>
            <select id="sort" onchange="loadItems(this.value)">
                <option value="default">Default Order</option>
                <option value="alphabetical">Alphabetical</option>
                <option value="rating">Rating</option>
                <option value="price">Price</option>
            </select>
        </div>

        <div id="itemsContainer"></div>
    </div>

    <script>
        let userBookmarkedItems = [];
        let currentUserId = null;

        async function loadUserData() {
            try {
                const localDataResponse = await fetch('/json/local/local_data.json');
                if (!localDataResponse.ok) {
                    throw new Error(`HTTP error! status: ${localDataResponse.status}`);
                }
                const localData = await localDataResponse.json();
                currentUserId = localData.currentlyLoggedInUserID;

                const accountsResponse = await fetch('/json/accounts.json');
                if (!accountsResponse.ok) {
                    throw new Error(`HTTP error! status: ${accountsResponse.status}`);
                }
                const accounts = await accountsResponse.json();

                const currentUser = accounts.find(account => account.id === currentUserId);
                
                const usernameElement = document.getElementById('username');
                if (currentUser && currentUser.username) {
                    usernameElement.textContent = currentUser.username;
                } else {
                    usernameElement.textContent = 'Guest User';
                }
            } catch (error) {
                console.error('Error loading user data:', error);
                document.getElementById('username').textContent = 'Guest User';
            }
        }

        async function loadItems(order = "default") {
            const res = await fetch("/api/my-items");
            const data = await res.json();
            let items = data.items;
            userBookmarkedItems = data.bookmarkedItems;

            items.forEach(item => {
                if (Array.isArray(item.ratings) && item.ratings.length > 0) {
                    const sum = item.ratings.reduce((acc, r) => acc + r.rating, 0);
                    item.avgRating = sum / item.ratings.length;
                } else {
                    item.avgRating = 0;
                }
            });

            if (order === "alphabetical") {
                items.sort((a, b) => a.name.localeCompare(b.name));
            } else if (order === "rating") {
                items.sort((a, b) => b.avgRating - a.avgRating);
            } else if (order === "price") {
                items.sort((a, b) => {
                    const parsePrice = str => parseFloat(str.replace(/[^0-9.]/g, ""));
                    return parsePrice(b.price) - parsePrice(a.price);
                });
            }

            renderItems(items);
        }

        async function runUserScript(params) {
            await fetch("/run-script", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ params })
            });
        }

        function renderItems(items) {
            const container = document.getElementById("itemsContainer");
            container.innerHTML = "";

            if (items.length === 0) {
                container.innerHTML = '<div style="text-align: center; padding: 40px; color: #6b7280; font-size: 18px;">You don\'t have any items yet.</div>';
                return;
            }

            items.forEach(item => {
                const itemBox = document.createElement("div");
                itemBox.className = "item-box";

                const isBookmarked = userBookmarkedItems.includes(item.id);

                const nameContainer = document.createElement("div");
                nameContainer.className = "item-name-container";
                
                const name = document.createElement("h3");
                name.textContent = item.name;
                nameContainer.appendChild(name);
                
                if (isBookmarked) {
                    const bookmarkEmoji = document.createElement("span");
                    bookmarkEmoji.className = "bookmark-emoji";
                    bookmarkEmoji.textContent = "🔖";
                    nameContainer.appendChild(bookmarkEmoji);
                }

                const price = document.createElement("p");
                price.innerHTML = `<strong>Price:</strong> <span class="price-text">${item.price}</span>`;

                const rating = document.createElement("p");
                const stars = "⭐".repeat(Math.floor(item.avgRating));
                rating.innerHTML = `<strong>Rating:</strong> <span class="rating-text">${item.avgRating.toFixed(1)} ${stars}</span>`;

                const img = document.createElement("img");
                img.className = "item-img";
                img.alt = item.name;
                img.src = `/images/items/${item.id}.png`;

                const imgButtons = document.createElement("div");
                imgButtons.className = "img-buttons";

                img.onload = () => {
                    imgButtons.innerHTML = `
                        <button>Replace Image</button>
                        <button>Delete Image</button>
                    `;
                };
                img.onerror = () => {
                    img.style.display = "none";
                    imgButtons.innerHTML = `<button>Add Image</button>`;
                };

                const actions = document.createElement("div");
                actions.className = "action-group";

                const rateDiv = document.createElement("div");
                rateDiv.className = "action-row";
                const rateSelect = document.createElement("select");
                for (let i = 1; i <= 5; i++) {
                    const opt = document.createElement("option");
                    opt.value = i;
                    opt.textContent = `${i} Star${i > 1 ? 's' : ''}`;
                    rateSelect.appendChild(opt);
                }
                const rateBtn = document.createElement("button");
                rateBtn.textContent = "Rate";
                rateBtn.onclick = () => runUserScript(rateSelect.value);
                rateDiv.appendChild(rateSelect);
                rateDiv.appendChild(rateBtn);

                const priceDiv = document.createElement("div");
                priceDiv.className = "action-row";
                const priceInput = document.createElement("input");
                priceInput.type = "text";
                priceInput.placeholder = "New Price";
                const priceBtn = document.createElement("button");
                priceBtn.textContent = "Set Price";
                priceBtn.onclick = () => runUserScript(priceInput.value);
                priceDiv.appendChild(priceInput);
                priceDiv.appendChild(priceBtn);

                const bookmarkBtn = document.createElement("button");
                bookmarkBtn.textContent = isBookmarked ? "Unbookmark" : "Bookmark";
                bookmarkBtn.onclick = () => runUserScript("bookmark");

                const sellUserDiv = document.createElement("div");
                sellUserDiv.className = "action-row";
                const sellUserSelect = document.createElement("select");
                sellUserSelect.innerHTML = `<option value="">Select User...</option>`;
                fetch("/api/accounts")
                    .then(res => res.json())
                    .then(accounts => {
                        accounts.forEach(acc => {
                            if (acc.id !== currentUserId) {
                                const opt = document.createElement("option");
                                opt.value = acc.id;
                                opt.textContent = acc.username;
                                sellUserSelect.appendChild(opt);
                            }
                        });
                    });
                const sellUserBtn = document.createElement("button");
                sellUserBtn.textContent = "Sell to User";
                sellUserBtn.onclick = () => runUserScript(sellUserSelect.value);
                sellUserDiv.appendChild(sellUserSelect);
                sellUserDiv.appendChild(sellUserBtn);

                const sellStoreDiv = document.createElement("div");
                sellStoreDiv.className = "action-row";
                const sellStoreSelect = document.createElement("select");
                sellStoreSelect.innerHTML = `<option value="">Select Store...</option>`;
                fetch("/api/locations")
                    .then(res => res.json())
                    .then(locations => {
                        locations.forEach(loc => {
                            const opt = document.createElement("option");
                            opt.value = loc.id;
                            opt.textContent = loc.name;
                            sellStoreSelect.appendChild(opt);
                        });
                    });
                const sellStoreBtn = document.createElement("button");
                sellStoreBtn.textContent = "Sell to Store";
                sellStoreBtn.onclick = () => runUserScript(sellStoreSelect.value);
                sellStoreDiv.appendChild(sellStoreSelect);
                sellStoreDiv.appendChild(sellStoreBtn);

                const commentsBtn = document.createElement("button");
                commentsBtn.textContent = "💬 Comments";

                actions.appendChild(rateDiv);
                actions.appendChild(priceDiv);
                actions.appendChild(bookmarkBtn);
                actions.appendChild(sellUserDiv);
                actions.appendChild(sellStoreDiv);
                actions.appendChild(commentsBtn);

                itemBox.appendChild(nameContainer);
                itemBox.appendChild(price);
                itemBox.appendChild(rating);
                itemBox.appendChild(img);
                itemBox.appendChild(imgButtons);
                itemBox.appendChild(actions);

                container.appendChild(itemBox);
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadUserData();
            loadItems();
        });
    </script>
</body>
</html>

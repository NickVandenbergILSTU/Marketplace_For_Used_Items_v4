<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Items</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f7f7f7;
            margin: 0;
            padding: 0;
        }

        h1 {
            text-align: center;
            padding: 20px;
        }

        #itemsContainer {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 16px;
            padding: 16px;
        }

        .item-box {
            border: 1px solid #ccc;
            border-radius: 12px;
            padding: 12px;
            background: #fff;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }

        .item-img {
            width: 100%;
            max-height: 150px;
            object-fit: contain;
            margin-bottom: 8px;
            display: block;
        }

        .item-box button {
            margin: 4px 2px;
            padding: 6px 10px;
            border-radius: 6px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>My Items</h1>
    <div>
        <label for="sort">Sort by:</label>
        <select id="sort" onchange="loadItems(this.value)">
            <option value="default">Default Order</option>
            <option value="alphabetical">Alphabetical</option>
            <option value="rating">Rating</option>
            <option value="price">Price</option>
        </select>
    </div>

    <div id="itemsContainer"></div>

    <script>
        async function loadItems(order = "default") {
            const res = await fetch("/api/items");
            let items = await res.json();

            // Sorting logic
            if (order === "alphabetical") {
                items.sort((a, b) => a.name.localeCompare(b.name));
            } else if (order === "rating") {
                items.sort((a, b) => (b.avgRating || 0) - (a.avgRating || 0));
            } else if (order === "price") {
                items.sort((a, b) => {
                    const parsePrice = str => parseFloat(str.replace(/[^0-9.]/g, ""));
                    return parsePrice(b.price) - parsePrice(a.price);
                });
            }
            // "default" = JSON order, leave as is

            renderItems(items);
        }

        function renderItems(items) {
            const container = document.getElementById("itemsContainer");
            container.innerHTML = "";

            items.forEach(item => {
                const itemBox = document.createElement("div");
                itemBox.className = "item-box";

                // Name
                const name = document.createElement("h3");
                name.textContent = item.name;

                // Price
                const price = document.createElement("p");
                price.textContent = `Price: ${item.price}`;

                // Rating with stars
                const rating = document.createElement("p");
                const stars = "⭐".repeat(Math.floor(item.avgRating || 0));
                rating.textContent = `Rating: ${item.avgRating?.toFixed(1) || "0.0"} ${stars}`;

                // Image
                const imgWrapper = document.createElement("div");
                const img = document.createElement("img");
                img.className = "item-img";
                img.alt = item.name;
                img.src = `/images/${item.id}.png`;

                img.onerror = () => {
                    img.style.display = "none"; // hide broken img
                };

                imgWrapper.appendChild(img);

                // Image buttons
                const imgButtons = document.createElement("div");
                if (img.complete && img.naturalWidth !== 0) {
                    imgButtons.innerHTML = `
                        <button>Replace Image</button>
                        <button>Delete Image</button>
                    `;
                } else {
                    imgButtons.innerHTML = `<button>Add Image</button>`;
                }

                // Action buttons
                const actions = document.createElement("div");
                actions.innerHTML = `
                    <button>Rate</button>
                    <button>Set Price</button>
                    <button>${item.bookmarked ? "Unbookmark" : "Bookmark"}</button>
                    <button>Sell to User</button>
                    <button>Sell to Store</button>
                    <button>Comments</button>
                `;

                // Build card
                itemBox.appendChild(name);
                itemBox.appendChild(price);
                itemBox.appendChild(rating);
                itemBox.appendChild(imgWrapper);
                itemBox.appendChild(imgButtons);
                itemBox.appendChild(actions);

                container.appendChild(itemBox);
            });
        }

        // Load default on startup
        loadItems();
    </script>
</body>
</html>

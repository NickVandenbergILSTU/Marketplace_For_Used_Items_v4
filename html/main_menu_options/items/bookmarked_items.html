<!DOCTYPE html>  
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bookmarked Items</title>
    <link rel="stylesheet" href="/html/css/items.css">
</head>
<body>
    <div class="header-panel">
        <button class="back-btn" onclick="window.location.href='/html/main_menu.html'">← Main Menu</button>
        <div class="header-title">Bookmarked Items</div>
        <div class="user-info">
            <div class="username" id="username">Loading...</div>
            <div class="balance" id="balance">$0.00</div>
        </div>
    </div>

    <div class="main-content">
        <div class="sort-controls">
            <label for="search">Search:</label>
            <input type="text" id="search" class="search-input" placeholder="Search items..." oninput="filterItems()">
            
            <label for="sort">Sort by:</label>
            <select id="sort" onchange="loadItems(this.value)">
                <option value="default">Default Order</option>
                <option value="alphabetical">Alphabetical</option>
                <option value="rating">Rating</option>
                <option value="price">Price</option>
            </select>
        </div>

        <div id="itemsContainer"></div>
    </div>

    <script>
        const HELPER_SCRIPT = './helper_scripts/run_user_script.sh';
        let userBookmarkedItems = [];
        let userReservedItems = [];
        let userCartItems = [];
        let userItemIds = [];
        let currentUserId = null;
        let allReservedItems = {};
        let allItems = [];
        let allAccounts = [];

        // Load user data
        async function loadUserData() {
            try {
                const localDataResponse = await fetch('/json/local/local_data.json');
                if (!localDataResponse.ok) throw new Error(`HTTP error! status: ${localDataResponse.status}`);
                const localData = await localDataResponse.json();
                currentUserId = localData.currentlyLoggedInUserID;

                const accountsResponse = await fetch('/json/accounts.json');
                if (!accountsResponse.ok) throw new Error(`HTTP error! status: ${accountsResponse.status}`);
                const accounts = await accountsResponse.json();
                allAccounts = accounts;

                const currentUser = accounts.find(account => account.id === currentUserId);
                const usernameElement = document.getElementById('username');
                const balanceElement = document.getElementById('balance');

                if (currentUser && currentUser.username) {
                    usernameElement.textContent = currentUser.username;
                    const balance = currentUser.accountBalance || currentUser.accountBlanance || 0;
                    const balanceNum = typeof balance === 'number' ? balance : parseFloat(balance);
                    balanceElement.textContent = `$${balanceNum.toFixed(2)}`;
                } else {
                    usernameElement.textContent = 'Guest User';
                    balanceElement.textContent = '$0.00';
                }
            } catch (error) {
                console.error('Error loading user data:', error);
                document.getElementById('username').textContent = 'Guest User';
                document.getElementById('balance').textContent = '$0.00';
            }
        }

        async function loadItems(order = "default") {
            const res = await fetch("/api/bookmarked-items");
            const data = await res.json();
            let items = data.items;

            userBookmarkedItems = data.bookmarkedItems || [];
            userReservedItems = data.reservedItems || [];
            userCartItems = data.itemsInCart || [];
            userItemIds = data.userItemIds || [];
            allReservedItems = data.allReservedItems || {};

            // Calculate average rating for each item
            items.forEach(item => {
                if (Array.isArray(item.ratings) && item.ratings.length > 0) {
                    const sum = item.ratings.reduce((acc, r) => acc + r.rating, 0);
                    item.avgRating = sum / item.ratings.length;
                } else {
                    item.avgRating = 0;
                }
            });

            // Sort items based on selected order
            if (order === "alphabetical") {
                items.sort((a, b) => a.name.localeCompare(b.name));
            } else if (order === "rating") {
                items.sort((a, b) => b.avgRating - a.avgRating);
            } else if (order === "price") {
                const parsePrice = str => parseFloat(str.replace(/[^0-9.]/g, ""));
                items.sort((a, b) => parsePrice(b.price) - parsePrice(a.price));
            }

            allItems = items;
            filterItems();
        }

        function filterItems() {
            const searchTerm = document.getElementById('search').value.toLowerCase();
            const filteredItems = allItems.filter(item => 
                item.name.toLowerCase().includes(searchTerm)
            );
            renderItems(filteredItems);
        }

        async function runUserScript(params) {
            await fetch("/run-script", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ params })
            });
        }

        async function openComments(itemId) {
            try {
                // Update selectedItemCommentID in local_data.json
                const params = [
                    HELPER_SCRIPT,
                    './use_cases/select_item_comment/select_item_comment.sh',
                    itemId.toString()
                ];

                const response = await fetch("/run-script", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ params })
                });

                if (response.ok) {
                    // Navigate to comments page
                    window.location.href = '/html/main_menu_options/items/item_comments/item_comments.html';
                } else {
                    console.error('Error setting selected item');
                }
            } catch (error) {
                console.error('Error opening comments:', error);
            }
        }

        function renameItem(itemId, newName) {
            console.log(`Rename item ${itemId} to: ${newName}`);
        }

        function deleteItem(itemId) {
            if (confirm('Are you sure you want to delete this item?')) {
                console.log(`Delete item ${itemId}`);
            }
        }

        function renderItems(items) {
            const container = document.getElementById("itemsContainer");
            container.innerHTML = "";

            if (items.length === 0) {
                container.innerHTML = '<div class="no-items">You have no bookmarked items.</div>';
                return;
            }

            items.forEach(item => {
                const itemBox = document.createElement("div");
                itemBox.className = "item-box";

                const isBookmarked = userBookmarkedItems.includes(item.id);
                const isReservedByCurrentUser = userReservedItems.includes(item.id);
                const isInCart = userCartItems.includes(item.id);
                const reservedByUserId = allReservedItems[item.id];
                const isReservedBySomeone = reservedByUserId !== undefined;
                const ownsItem = item.ownership.type === 'user';

                // Create ownership badge
                const ownershipBadge = document.createElement("div");
                ownershipBadge.style.cssText = "background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%); color: white; padding: 6px 12px; border-radius: 20px; font-size: 14px; font-weight: 600; margin-bottom: 10px; display: inline-block;";
                if (item.ownership.type === 'user') {
                    ownershipBadge.textContent = `My Item`;
                } else if (item.ownership.type === 'store') {
                    ownershipBadge.textContent = `${item.ownership.name}'s Inventory`;
                }

                const nameContainer = document.createElement("div");
                nameContainer.className = "item-name-container";
                const name = document.createElement("h3");
                name.textContent = item.name;
                nameContainer.appendChild(name);

                if (isBookmarked) {
                    const bookmarkEmoji = document.createElement("span");
                    bookmarkEmoji.className = "bookmark-emoji";
                    bookmarkEmoji.textContent = "🔖";
                    nameContainer.appendChild(bookmarkEmoji);
                }

                const price = document.createElement("p");
                price.innerHTML = `<strong>Price:</strong> <span class="price-text">${item.price}</span>`;

                const rating = document.createElement("p");
                const stars = "⭐".repeat(Math.floor(item.avgRating));
                rating.innerHTML = `<strong>Rating:</strong> <span class="rating-text">${item.avgRating.toFixed(1)} ${stars}</span>`;

                let reservedBadge = null;
                if (isReservedBySomeone) {
                    reservedBadge = document.createElement("div");
                    reservedBadge.className = "reserved-badge";
                    reservedBadge.innerHTML = `<span>❗</span><span>Reserved</span>`;
                }

                const img = document.createElement("img");
                img.className = "item-img";
                img.alt = item.name;
                img.src = `/images/items/${item.id}.png`;
                img.onerror = () => (img.style.display = "none");

                const actions = document.createElement("div");
                actions.className = "action-group";

                // If user owns the item, show my_items.html controls
                if (ownsItem) {
                    const imgButtons = document.createElement("div");
                    imgButtons.className = "img-buttons";
                    img.onload = () => {
                        imgButtons.innerHTML = `
                            <button>Replace Image</button>
                            <button>Delete Image</button>
                        `;
                    };

                    const renameDiv = document.createElement("div");
                    renameDiv.className = "action-row";
                    const renameInput = document.createElement("input");
                    renameInput.type = "text";
                    renameInput.placeholder = "New Name";
                    const renameBtn = document.createElement("button");
                    renameBtn.textContent = "Rename";
                    renameBtn.onclick = () => renameItem(item.id, renameInput.value);
                    renameDiv.appendChild(renameInput);
                    renameDiv.appendChild(renameBtn);

                    const rateDiv = document.createElement("div");
                    rateDiv.className = "action-row";
                    const rateSelect = document.createElement("select");
                    for (let i = 1; i <= 5; i++) {
                        const opt = document.createElement("option");
                        opt.value = i;
                        opt.textContent = `${i} Star${i > 1 ? 's' : ''}`;
                        rateSelect.appendChild(opt);
                    }
                    const rateBtn = document.createElement("button");
                    rateBtn.textContent = "Rate";
                    rateBtn.onclick = () => runUserScript(rateSelect.value);
                    rateDiv.appendChild(rateSelect);
                    rateDiv.appendChild(rateBtn);

                    const priceDiv = document.createElement("div");
                    priceDiv.className = "action-row";
                    const priceInput = document.createElement("input");
                    priceInput.type = "text";
                    priceInput.placeholder = "New Price";
                    const priceBtn = document.createElement("button");
                    priceBtn.textContent = "Set Price";
                    priceBtn.onclick = () => runUserScript(priceInput.value);
                    priceDiv.appendChild(priceInput);
                    priceDiv.appendChild(priceBtn);

                    const bookmarkBtn = document.createElement("button");
                    bookmarkBtn.textContent = "Unbookmark";
                    bookmarkBtn.onclick = () => runUserScript("bookmark");

                    const deleteBtn = document.createElement("button");
                    deleteBtn.textContent = "🗑️ Delete Item";
                    deleteBtn.onclick = () => deleteItem(item.id);

                    const sellUserDiv = document.createElement("div");
                    sellUserDiv.className = "action-row";
                    const sellUserSelect = document.createElement("select");
                    sellUserSelect.innerHTML = `<option value="">Select User...</option>`;
                    allAccounts.forEach(acc => {
                        if (acc.id !== currentUserId) {
                            const opt = document.createElement("option");
                            opt.value = acc.id;
                            opt.textContent = acc.username;
                            sellUserSelect.appendChild(opt);
                        }
                    });
                    const sellUserBtn = document.createElement("button");
                    sellUserBtn.textContent = "Sell to User";
                    sellUserBtn.onclick = () => runUserScript(sellUserSelect.value);
                    sellUserDiv.appendChild(sellUserSelect);
                    sellUserDiv.appendChild(sellUserBtn);

                    const sellStoreDiv = document.createElement("div");
                    sellStoreDiv.className = "action-row";
                    const sellStoreSelect = document.createElement("select");
                    sellStoreSelect.innerHTML = `<option value="">Select Store...</option>`;
                    fetch("/api/locations")
                        .then(res => res.json())
                        .then(locations => {
                            locations.forEach(loc => {
                                const opt = document.createElement("option");
                                opt.value = loc.id;
                                opt.textContent = loc.name;
                                sellStoreSelect.appendChild(opt);
                            });
                        });
                    const sellStoreBtn = document.createElement("button");
                    sellStoreBtn.textContent = "Sell to Store";
                    sellStoreBtn.onclick = () => runUserScript(sellStoreSelect.value);
                    sellStoreDiv.appendChild(sellStoreSelect);
                    sellStoreDiv.appendChild(sellStoreBtn);

                    const commentsBtn = document.createElement("button");
                    commentsBtn.textContent = "💬 Comments";
                    commentsBtn.onclick = () => openComments(item.id);

                    actions.appendChild(renameDiv);
                    actions.appendChild(rateDiv);
                    actions.appendChild(priceDiv);
                    actions.appendChild(bookmarkBtn);
                    actions.appendChild(deleteBtn);
                    actions.appendChild(sellUserDiv);
                    actions.appendChild(sellStoreDiv);
                    actions.appendChild(commentsBtn);

                    itemBox.appendChild(ownershipBadge);
                    itemBox.appendChild(nameContainer);
                    itemBox.appendChild(price);
                    itemBox.appendChild(rating);
                    if (reservedBadge) itemBox.appendChild(reservedBadge);
                    itemBox.appendChild(img);
                    itemBox.appendChild(imgButtons);
                    itemBox.appendChild(actions);
                } else {
                    // Store item - show store_items.html controls
                    const rateDiv = document.createElement("div");
                    rateDiv.className = "action-row";
                    const rateSelect = document.createElement("select");
                    for (let i = 1; i <= 5; i++) {
                        const opt = document.createElement("option");
                        opt.value = i;
                        opt.textContent = `${i} Star${i > 1 ? 's' : ''}`;
                        rateSelect.appendChild(opt);
                    }
                    const rateBtn = document.createElement("button");
                    rateBtn.textContent = "Rate";
                    rateBtn.onclick = () => runUserScript(rateSelect.value);
                    rateDiv.appendChild(rateSelect);
                    rateDiv.appendChild(rateBtn);

                    const bookmarkBtn = document.createElement("button");
                    bookmarkBtn.textContent = "Unbookmark";
                    bookmarkBtn.onclick = () => runUserScript("bookmark");

                    if (!isReservedBySomeone || isReservedByCurrentUser) {
                        const reserveBtn = document.createElement("button");
                        reserveBtn.textContent = isReservedByCurrentUser ? "Unreserve Item" : "Reserve Item";
                        reserveBtn.onclick = () => runUserScript("reserve");
                        actions.appendChild(reserveBtn);
                    }

                    const cartBtn = document.createElement("button");
                    cartBtn.textContent = isInCart ? "🛒 Remove from Cart" : "🛒 Add to Cart";
                    cartBtn.onclick = () => runUserScript("cart");

                    const commentsBtn = document.createElement("button");
                    commentsBtn.textContent = "💬 Comments";
                    commentsBtn.onclick = () => openComments(item.id);

                    actions.appendChild(rateDiv);
                    actions.appendChild(bookmarkBtn);
                    actions.appendChild(cartBtn);
                    actions.appendChild(commentsBtn);

                    itemBox.appendChild(ownershipBadge);
                    itemBox.appendChild(nameContainer);
                    itemBox.appendChild(price);
                    itemBox.appendChild(rating);
                    if (reservedBadge) itemBox.appendChild(reservedBadge);
                    itemBox.appendChild(img);
                    itemBox.appendChild(actions);
                }

                container.appendChild(itemBox);
            });
        }

        document.addEventListener('DOMContentLoaded', async () => {
            await loadUserData();
            await loadItems();
        });
    </script>
</body>
</html>

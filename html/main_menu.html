<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Main Menu</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            padding: 0;
        }

        .header-panel {
            background: linear-gradient(135deg, #dc2626 0%, #b91c1c 100%);
            color: white;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 20px rgba(220, 38, 38, 0.3);
            position: relative;
        }

        .header-panel::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(45deg, rgba(255, 255, 255, 0.1) 0%, rgba(255, 255, 255, 0) 100%);
            pointer-events: none;
        }

        .header-title {
            font-size: 2.5em;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
            letter-spacing: 1px;
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
        }

        .logout-btn {
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid white;
            color: white;
            padding: 12px 24px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .logout-btn:hover {
            background: white;
            color: #dc2626;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 255, 255, 0.3);
        }

        .logout-btn:disabled {
            background: rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.6);
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .username {
            font-size: 18px;
            font-weight: 600;
            color: white;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .main-content {
            padding: 40px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 40px;
            margin-top: 20px;
        }

        .menu-column {
            background: white;
            border-radius: 20px;
            padding: 30px 25px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            border: 1px solid rgba(0, 0, 0, 0.05);
        }

        .menu-column:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
        }

        .column-title {
            font-size: 1.4em;
            font-weight: bold;
            color: #1f2937;
            margin-bottom: 25px;
            text-align: center;
            padding-bottom: 15px;
            border-bottom: 3px solid #dc2626;
            position: relative;
        }

        .column-title::after {
            content: '';
            position: absolute;
            bottom: -3px;
            left: 50%;
            transform: translateX(-50%);
            width: 50px;
            height: 3px;
            background: linear-gradient(135deg, #dc2626, #b91c1c);
            border-radius: 2px;
        }

        .menu-button {
            display: block;
            width: 100%;
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            border: 2px solid #e5e7eb;
            color: #374151;
            padding: 15px 20px;
            margin-bottom: 12px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 500;
            transition: all 0.3s ease;
            text-align: left;
            position: relative;
            overflow: hidden;
        }

        .menu-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(220, 38, 38, 0.1), transparent);
            transition: left 0.5s ease;
        }

        .menu-button:hover {
            background: linear-gradient(135deg, #dc2626 0%, #b91c1c 100%);
            color: white;
            border-color: #dc2626;
            transform: translateX(5px);
            box-shadow: 0 5px 20px rgba(220, 38, 38, 0.3);
        }

        .menu-button:hover::before {
            left: 100%;
        }

        .menu-button:last-child {
            margin-bottom: 0;
        }

        .menu-button:active {
            transform: translateX(3px) scale(0.98);
        }

        /* Special styling for the untitled column */
        .untitled-column .column-title {
            color: #6366f1;
            border-bottom-color: #6366f1;
        }

        .untitled-column .column-title::after {
            background: linear-gradient(135deg, #6366f1, #4f46e5);
        }

        .untitled-column .menu-button:hover {
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            border-color: #6366f1;
            box-shadow: 0 5px 20px rgba(99, 102, 241, 0.3);
        }

        /* Loading overlay styles */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .loading-content {
            background: white;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #dc2626;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 768px) {
            .header-panel {
                padding: 15px 20px;
                flex-direction: column;
                gap: 15px;
            }

            .header-title {
                position: static;
                transform: none;
                font-size: 2em;
            }

            .main-content {
                padding: 20px;
            }

            .menu-grid {
                grid-template-columns: 1fr;
                gap: 25px;
            }

            .menu-column {
                padding: 25px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="header-panel">
        <button class="logout-btn" id="logoutBtn" onclick="logout()">Log Out</button>
        <div class="header-title">Main Menu</div>
        <div class="username" id="username">Loading...</div>
    </div>

    <div class="main-content">
        <div class="menu-grid">
            <div class="menu-column">
                <h2 class="column-title">Stores</h2>
                <button class="menu-button" onclick="openDefaultStore()">Open Default Store</button>
                <button class="menu-button" onclick="viewAllStores()">All Stores</button>
                <button class="menu-button" onclick="viewMyStores()">My Stores</button>
            </div>

            <div class="menu-column">
                <h2 class="column-title">Items</h2>
                <button class="menu-button" onclick="viewMyItems()">My Items</button>
                <button class="menu-button" onclick="viewOrderHistory()">Order History</button>
                <button class="menu-button" onclick="viewBookmarkedItems()">Bookmarked Items</button>
                <button class="menu-button" onclick="viewReservedItems()">My Reserved Items</button>
                <button class="menu-button" onclick="viewShoppingCart()">Shopping Cart</button>
            </div>

            <div class="menu-column">
                <h2 class="column-title">Users</h2>
                <button class="menu-button" onclick="viewAllAccounts()">All Accounts</button>
                <button class="menu-button" onclick="viewMyAccount()">My Account</button>
            </div>

            <div class="menu-column untitled-column">
                <h2 class="column-title">&nbsp;</h2>
                <button class="menu-button" onclick="openAIAssistant()">AI Assistant</button>
                <button class="menu-button" onclick="autoPushPullData()">Auto Push and Pull Data</button>
            </div>
        </div>
    </div>

    <!-- Loading overlay -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-content">
            <div class="spinner"></div>
            <div>Logging out, please wait...</div>
        </div>
    </div>

    <script>
        let userData = null;

        // Check if user is authenticated on page load
        function checkAuthentication() {
            // Clear any previous history state that might allow back navigation
            if (window.history && window.history.pushState) {
                // Replace current history entry
                window.history.replaceState(null, null, window.location.href);
                
                // Prevent back navigation
                window.addEventListener('popstate', function(event) {
                    window.history.pushState(null, null, window.location.href);
                });
            }
        }

        // Load user data based on currently logged in user ID
        async function loadUserData() {
            try {
                // First, get the currently logged in user ID from local data
                const localDataResponse = await fetch('/json/local/local_data.json');
                if (!localDataResponse.ok) {
                    throw new Error(`HTTP error! status: ${localDataResponse.status}`);
                }
                const localData = await localDataResponse.json();
                const currentlyLoggedInUserID = localData.currentlyLoggedInUserID;

                // Then, get all accounts data
                const accountsResponse = await fetch('/json/accounts.json');
                if (!accountsResponse.ok) {
                    throw new Error(`HTTP error! status: ${accountsResponse.status}`);
                }
                const accounts = await accountsResponse.json();

                // Find the account with matching ID
                const currentUser = accounts.find(account => account.id === currentlyLoggedInUserID);
                
                // Display username
                const usernameElement = document.getElementById('username');
                if (currentUser && currentUser.username) {
                    usernameElement.textContent = currentUser.username;
                } else {
                    usernameElement.textContent = 'Guest User';
                }
            } catch (error) {
                console.error('Error loading user data:', error);
                document.getElementById('username').textContent = 'Guest User';
            }
        }

        // Enhanced logout function
        async function logout() {
            if (confirm('Are you sure you want to log out?')) {
                const logoutBtn = document.getElementById('logoutBtn');
                const loadingOverlay = document.getElementById('loadingOverlay');
                
                try {
                    // Disable logout button and show loading
                    logoutBtn.disabled = true;
                    logoutBtn.textContent = 'Logging Out...';
                    loadingOverlay.style.display = 'flex';

                    // Send request to run the logout script
                    const response = await fetch('/run-script', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            action: 'logout',
                            timestamp: new Date().toISOString()
                        })
                    });

                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }

                    // Wait for the response to ensure script completion
                    const result = await response.json();
                    console.log('Logout script completed:', result);

                    // Clear any session data from memory
                    userData = null;
                    
                    // Clear browser history to prevent back navigation
                    if (window.history && window.history.pushState) {
                        // Clear the history stack
                        window.history.replaceState(null, null, '/html/login_create_forgotpass');
                    }

                    // Redirect to login page
                    window.location.replace('/html/login_create_forgotpass');
                    
                } catch (error) {
                    console.error('Error during logout:', error);
                    
                    // Re-enable button on error
                    logoutBtn.disabled = false;
                    logoutBtn.textContent = 'Log Out';
                    loadingOverlay.style.display = 'none';
                    
                    // Still redirect to login on error, but inform user
                    alert('There was an issue during logout, but you will be redirected to the login page.');
                    window.location.replace('/html/login_create_forgotpass');
                }
            }
        }

        // Menu button functions
        function openDefaultStore() {
            window.location.href = '/store/default';
        }

        function viewAllStores() {
            window.location.href = '/stores/all';
        }

        function viewMyStores() {
            window.location.href = '/stores/my';
        }

        function viewMyItems() {
            window.location.href = '/items/my';
        }

        function viewOrderHistory() {
            window.location.href = '/orders/history';
        }

        function viewBookmarkedItems() {
            window.location.href = '/items/bookmarked';
        }

        function viewReservedItems() {
            window.location.href = '/items/reserved';
        }

        function viewShoppingCart() {
            window.location.href = '/cart';
        }

        function viewAllAccounts() {
            window.location.href = '/users/all';
        }

        function viewMyAccount() {
            window.location.href = '/users/my-account';
        }

        function openAIAssistant() {
            window.location.href = '/ai/assistant';
        }

        function autoPushPullData() {
            window.location.href = '/data/sync';
        }

        // Load user data and setup authentication check when page loads
        document.addEventListener('DOMContentLoaded', function() {
            checkAuthentication();
            loadUserData();
        });

        // Prevent back navigation after logout
        window.addEventListener('beforeunload', function() {
            // This will help prevent users from navigating back using browser refresh
        });
    </script>
</body>
</html>
